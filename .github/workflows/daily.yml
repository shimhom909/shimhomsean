name: 每日更新動能雷達

on:
  schedule:
    # UTC 22:10 = 台灣早上 06:10（美股收盤後約 2 小時，夏令時間）
    # 冬令時間會晚一小時抓到，資料一樣正確，不影響
    - cron: "10 22 * * 2-6"
  workflow_dispatch:        # 允許在 GitHub 網頁上手動按按鈕跑
  push:
    branches: [main]
    # 改了設定或計算邏輯就自動重跑重新部署，不必記得手動觸發。
    # 只列會影響輸出的檔案：改 README 之類的不需要重跑。
    # 這個 workflow 不會 commit 回 repo（只部署到 Pages），沒有無限迴圈風險。
    paths:
      - themes.yaml
      - supply_chain.yaml
      - radar.py
      - flows.py
      - twrev.py
      - index.html
      - requirements.txt
      - .github/workflows/daily.yml

permissions:
  contents: write   # 需要能把重新整理過的快取檔案 commit 回 repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原快取（資金流向 + 台廠營收歷史）
        uses: actions/cache@v4
        with:
          path: |
            flows.json
            flows_history.json
            twchain.json
            twrev_history.json
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: 抓內部人交易與融券（每週二 + 手動觸發）
        # 這兩類資料變動慢（Form 4 兩天內申報、融券兩週公布一次），
        # 每天抓沒有意義，只會拖慢排程並對 SEC 造成不必要負擔。
        continue-on-error: true
        run: |
          DOW=$(date -u +%u)   # 1=週一 … 7=週日
          if [ "$DOW" = "2" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "執行資金流向模組…"
            python flows.py
          else
            echo "今天不是週二，沿用快取的 flows.json"
          fi

      - name: 抓台廠月營收（每月 11–15 日 + 手動觸發）
        # 台灣規定每月 10 日前公布上月營收，所以 11 日之後才抓得到新資料。
        # 抓 11–15 日這個區間是為了容錯：某天失敗還有機會補上。
        continue-on-error: true
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" -ge 11 ] && [ "$DOM" -le 15 ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "執行台廠供應鏈模組…"
            python twrev.py
          else
            echo "非月營收公布期間，沿用快取的 twchain.json"
          fi

      - name: 提交更新後的快取資料
        # flows.json / flows_history.json / twchain.json / twrev_history.json
        # 原本只活在 Actions 快取裡，從沒寫回 repo——快取有「7 天沒被存取
        # 就清掉」的規則，一旦哪週排程漏跑或快取被清空，flows_history.json
        # 好不容易累積的期數、twrev_history.json 的月度歷史會直接歸零，
        # 沒有任何救回的辦法。commit 回 git 之後快取只是加速用，
        # git 才是真正的存續依據，順便讓本機開發看到的資料跟線上一致。
        #
        # 這四個檔案沒有列在上面 on.push.paths 裡，所以這個 commit
        # 不會再觸發一次 push 事件，不會無限迴圈。
        continue-on-error: true    # 這步失敗不該讓整個部署失敗，快取仍是備援
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f flows.json flows_history.json twchain.json twrev_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "快取資料無變化，不需要 commit"
          else
            git commit -m "自動更新快取資料 [skip ci]"
            git push
          fi

      - name: 抓資料並計算動能
        run: python radar.py

      - name: 同步 Notion 潛力股評分表週摘要（每週六 + 手動觸發）
        # cron 排在週二~週六 22:10 UTC（美股收盤後），週六那次抓到的
        # 是週五收盤的資料，等於「這週結束」的快照，適合當週摘要基準。
        # NOTION_TOKEN 需要在 repo Settings → Secrets and variables →
        # Actions 設定，這裡不會、也不該把 token 寫進任何檔案。
        continue-on-error: true    # Notion 那邊有狀況不該連累網站部署
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          DOW=$(date -u +%u)   # 1=週一 … 7=週日
          if [ -z "$NOTION_TOKEN" ]; then
            echo "未設定 NOTION_TOKEN，略過 Notion 同步"
          elif [ "$DOW" = "6" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "執行 Notion 週摘要同步…"
            python notion_sync.py
          else
            echo "非週六，略過 Notion 同步"
          fi

      - name: 打包網站
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          # history.json 由 radar.py 每次重算整段期間產出，不需要快取
          [ -f history.json ] && cp history.json _site/ || true
          [ -f flows.json ] && cp flows.json _site/ || true
          [ -f twchain.json ] && cp twchain.json _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
