name: 每日更新動能雷達

on:
  schedule:
    # UTC 22:10 = 台灣早上 06:10（美股收盤後約 2 小時，夏令時間）
    # 冬令時間會晚一小時抓到，資料一樣正確，不影響
    - cron: "10 22 * * 2-6"
  workflow_dispatch:        # 允許在 GitHub 網頁上手動按按鈕跑
  push:
    branches: [main]
    # 改了設定或計算邏輯就自動重跑重新部署，不必記得手動觸發。
    # 只列會影響輸出的檔案：改 README 之類的不需要重跑。
    # 這個 workflow 不會 commit 回 repo（只部署到 Pages），沒有無限迴圈風險。
    paths:
      - themes.yaml
      - supply_chain.yaml
      - radar.py
      - flows.py
      - twrev.py
      - catalysts.py
      - index.html
      - requirements.txt
      - .github/workflows/daily.yml

permissions:
  contents: write   # 需要能把重新整理過的快取檔案 commit 回 repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原快取（資金流向 + 台廠營收歷史）
        uses: actions/cache@v4
        with:
          path: |
            flows.json
            flows_history.json
            twchain.json
            twrev_history.json
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      # ⚠️ 下面兩步原本用「今天星期幾／幾號」決定要不要跑，但 GitHub 排程
      # 常延遲 3–4 小時，UTC 22:10 的排程實際落在隔天凌晨，星期幾整個錯開
      # 一天——週二的 flows.py 變成週三執行而被跳過，9/29 之後六週沒更新。
      # 改成看「資料本身多舊」，排程延遲多久都不影響。
      - name: 抓內部人交易與融券（資料超過 6 天 + 手動觸發）
        # 這兩類資料變動慢（Form 4 兩天內申報、融券兩週公布一次），
        # 每週抓一次就夠，每天抓只會拖慢排程並對 SEC 造成不必要負擔。
        continue-on-error: true
        run: |
          AGE=$(python -c "import json,datetime as d; g=json.load(open('flows.json', encoding='utf-8'))['generated_at']; print((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g)).days)" 2>/dev/null || echo 999)
          echo "flows.json 已 ${AGE} 天未更新"
          if [ "$AGE" -ge 6 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "執行資金流向模組…"
            python flows.py
          else
            echo "資料仍新，沿用 flows.json"
          fi

      - name: 抓台廠月營收（每月 11 日後、上月資料未到手 + 手動觸發）
        # 台灣規定每月 10 日前公布上月營收，11 日後才抓得到。
        # 只要 twchain.json 還不是上個月的資料就一直重試，抓到就停——
        # 不再依賴「剛好在 11–15 日跑到」，延遲或某天失敗都會自動補上。
        continue-on-error: true
        run: |
          NEED=$(python -c "
          import json, datetime as d
          t = d.datetime.now(d.timezone(d.timedelta(hours=8))).date()
          prev = (t.replace(day=1) - d.timedelta(days=1)).strftime('%Y-%m')
          try: have = json.load(open('twchain.json', encoding='utf-8')).get('period')
          except Exception: have = None
          print('yes' if t.day >= 11 and have != prev else 'no')
          " 2>/dev/null || echo yes)
          if [ "$NEED" = "yes" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "執行台廠供應鏈模組…"
            python twrev.py
          else
            echo "已有上月營收資料（或尚未到 11 日），沿用 twchain.json"
          fi

      - name: 提交更新後的快取資料
        # flows.json / flows_history.json / twchain.json / twrev_history.json
        # 原本只活在 Actions 快取裡，從沒寫回 repo——快取有「7 天沒被存取
        # 就清掉」的規則，一旦哪週排程漏跑或快取被清空，flows_history.json
        # 好不容易累積的期數、twrev_history.json 的月度歷史會直接歸零，
        # 沒有任何救回的辦法。commit 回 git 之後快取只是加速用，
        # git 才是真正的存續依據，順便讓本機開發看到的資料跟線上一致。
        #
        # 這四個檔案沒有列在上面 on.push.paths 裡，所以這個 commit
        # 不會再觸發一次 push 事件，不會無限迴圈。
        continue-on-error: true    # 這步失敗不該讓整個部署失敗，快取仍是備援
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f flows.json flows_history.json twchain.json twrev_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "快取資料無變化，不需要 commit"
          else
            git commit -m "自動更新快取資料 [skip ci]"
            # 兩次執行撞在一起時（例如手動觸發剛好碰到排程），遠端會先多一筆
            # commit 導致 push 被拒。這四個檔案只有 bot 會寫，rebase 不會衝突。
            for i in 1 2 3; do
              git push && break
              echo "push 被拒，第 $i 次 rebase 後重試…"
              git pull --rebase origin main
            done
          fi

      - name: 抓資料並計算動能
        run: python radar.py

      - name: 抓週輪動的同期新聞
        # 外部服務（Google News RSS），失敗就只少了新聞，價格歸因照樣顯示
        continue-on-error: true
        run: python catalysts.py

      - name: 同步 Notion 潛力股評分表週摘要
        # 每次都呼叫，由 notion_sync.py 自己判斷：資料日是週五收盤（一週結束的
        # 快照）且這一天還沒寫過才寫。原本用「今天是週六」判斷，但排程延遲讓
        # 週六的執行落到週日而被跳過，所以從沒自動寫入過。手動觸發加 --force
        # 可寫入非週五的資料（仍不會重複寫同一天）。
        # NOTION_TOKEN 需要在 repo Settings → Secrets and variables →
        # Actions 設定，這裡不會、也不該把 token 寫進任何檔案。
        continue-on-error: true    # Notion 那邊有狀況不該連累網站部署
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "⚠️ 未設定 NOTION_TOKEN secret，略過 Notion 同步"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python notion_sync.py --force
          else
            python notion_sync.py
          fi

      - name: 打包網站
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          # history.json 由 radar.py 每次重算整段期間產出，不需要快取
          [ -f history.json ] && cp history.json _site/ || true
          [ -f flows.json ] && cp flows.json _site/ || true
          [ -f twchain.json ] && cp twchain.json _site/ || true
          [ -f catalysts.json ] && cp catalysts.json _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
