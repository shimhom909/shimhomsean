  # ============================================================
  #  依 Notion「潛力股量化評分表」總分 ≥ 3.6 新增（2026-10 評分）
  #
  #  評分 ≥3.6 共 9 檔：MU、SNPS/CDNS、ARM、S、CRDO、AMD、VST、ALAB、BE。
  #  MU、AMD、ALAB 原本就在對應表裡；以下是新增的對應，以及「沒加」的原因。
  #  這個對應表的邏輯是「台廠營收 → 美股需求」，所以只有查得到可信
  #  台廠供應關係的才加，不為了湊數硬配——硬配出來的低品質讀數
  #  只會被誤讀成真的需求訊號。
  #
  #  未新增（查無可信的台廠供應關係，不是疏漏）：
  #    SNPS/CDNS — EDA 軟體，需求不會反映在台廠營收上
  #    S         — 資安軟體，無台灣供應鏈
  #    VST       — 德州獨立發電商，無台灣供應鏈
  # ============================================================

  # ---------- CRDO（Credo）----------
  "3665":
    name: 貿聯-KY
    market: twse
    purity: 0.40          # AEC 是貿聯前三大產品線之一，但也有其他 AI 線纜業務
    # 董事長 2025/2 公開表示合作六年、仍是 Credo AEC 獨家供應商；
    # 2026/7 券商報告仍列為主要供應商。風險：市場多次傳 Credo 引進
    # 第二供應商（貿聯否認），若屬實會稀釋這個對應的參考價值。
    maps_to: {CRDO: 3}

  # ---------- BE（Bloom Energy）----------
  # 台灣約占 Bloom SOFC 關鍵零組件三成（工商時報），以下為 Digitimes／
  # Taiwan News 點名的供應商。注意：Bloom 不公開供應商名單與採購量，
  # 比重數字全來自媒體報導，不是 Bloom 揭露。
  "8996":
    name: 高力
    market: twse
    purity: 0.45          # 報導稱約 40–50% 營收來自 Bloom 相關業務
    maps_to: {BE: 3}

  "6282":
    name: 康舒
    market: twse
    purity: 0.15          # 供應商之一，但 Bloom 相關占其營收比重小
    maps_to: {BE: 1}
  # 保來得（Porite）也是主要供應商，但 TWSE 端點查無資料（上櫃/興櫃），
  # 屬上櫃無月營收端點的已知限制，暫不納入。

  # ---------- ARM ----------
  # ⚠️ 弱關聯：聯發科長期是 Arm 授權客戶、其 SoC 量能與 Arm 權利金
  # 方向相關，但查不到權利金占比等可量化依據，且 Arm 權利金還受
  # 授權費與客戶結構影響。weight 1＋低純度，信心度自然會很低，
  # 只當參考方向，不要當成 Arm 需求的可靠指標。
  "2454":
    name: 聯發科
    market: twse
    purity: 0.35
    maps_to: {ARM: 1}
