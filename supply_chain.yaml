# ============================================================
#  台股供應鏈 → 美股對應表
#
#  邏輯：台灣上市櫃公司每月 10 日前公布上月營收，美股是季報，
#        中間有 3 週到 2 個月的時間差。用台廠營收推估美廠季度表現。
#
#  weight（1–3）= 這家台廠的營收對該美股的參考價值
#    3 = 高度純粹，營收幾乎直接反映該美股的需求
#    2 = 明顯相關，但混雜其他業務
#    1 = 有關聯，但雜訊大
#
#  purity（0–1）= 該台廠有多少比例的營收來自 AI／該應用
#    這個數字用來計算訊號可信度。憑印象填即可，寧可保守。
#
#  market: twse（上市）/ tpex（上櫃）
#    上櫃目前官方 API 沒有月營收端點，會顯示無資料，屬已知限制。
# ============================================================

