# ============================================================
#  主題籃子設定檔
#  這是整個系統唯一需要你手動維護的檔案。
#  規則：
#    1. 主題名稱可以用中文，冒號後面不要有多餘空格以外的符號
#    2. 每個主題建議 6 檔以上，少於 4 檔系統會自動略過
#    3. 代號用美股 ticker（大寫），抓不到的會自動剔除並記錄在 log
#    4. group 只影響儀表板分頁：growth / cyclical / hedge
# ============================================================

# SEC 規定抓取資料時必須表明身分，請把下面改成你自己的 email。
# 不改也能跑，但 SEC 可能會擋。格式就是「名字 email」這樣一行。
sec_user_agent: "Personal Research your-email@example.com"

insider_lookback_days: 90   # 內部人交易回看幾天

# 動能分數的因子組合。
#   legacy       — 現行公式。注意 rs20 與 roc20 在橫斷面排名下完全等價
#                  （實測 730/730 個交易日名次相同），所以 0.55 權重
#                  其實全押在同一個「20 日報酬」，名目五因子實為四個。
#   decorrelated — 把重複的那 0.25 換成 roc60，拉開時間尺度並補上中長期因子。
# 切換會讓 history.json 的歷史分數不可比（同一天名次會變），預設維持 legacy。
# 兩組公式的實際差異可執行 python _compare_profiles.py 查看。
scoring:
  profile: legacy

benchmark: SPY          # 相對強度的比較基準
lookback_days: 750      # 抓多久的歷史資料（日曆天）
                        # 200 日均線 + 52 週高點需要約 250 個交易日才算得出來，
                        # 750 日曆天 ≈ 515 個交易日，留足暖機期給大盤狀態指標。
chart_weeks: 14         # 卡片折線圖顯示幾週

# 風險偏好比值：用兩檔 ETF 的相對強弱判斷資金往哪邊跑。
# 這些代號不會列入主題，只用來判斷整體環境。
macro_ratios:
  - {num: QQQ, den: SPY, label: "成長/大盤"}
  - {num: IWM, den: SPY, label: "小型/大盤"}
  - {num: HYG, den: IEF, label: "信用風險偏好"}
  - {num: SPY, den: TLT, label: "股/債"}

# 債市壓力預警。
# 目的是在債券被大量或持續拋售的當下就亮燈，而不是等主題動能自己跌破。
# 殖利率指數(^開頭)沒有成交量，「大量」只能靠債券 ETF 的量能確認，兩者要並用。
rate_watch:
  y10: "^TNX"          # 10 年期殖利率
  y30: "^TYX"          # 30 年期
  y_short: "^IRX"      # 13 週國庫券，拿來算期限利差
  bondvol: "^MOVE"     # 債市波動指數，等同債券版的 VIX
  etfs: [TLT, IEF]     # 有成交量，用來確認是否「大量」拋售
  # 量測用，不是建議標的：算出各自對殖利率的實際 beta，
  # 才知道哪些東西真的能抵銷利率風險、哪些只是名字聽起來像避險。
  hedge_probe: [GLD, UUP, SHV, XLU, XLP, TLT]
  beta_window: 120     # rate beta 的迴歸視窗（交易日）

themes:

  # ---------- 成長 / AI 科技線 ----------
  光通訊矽光子:
    group: growth
    # GLW（康寧）業務描述首項就是 optical communications（光纖），歸這裡。
    tickers: [COHR, LITE, AAOI, FN, CRDO, POET, GLW]

  AI互連ASIC:
    group: growth
    # ARM 是 CPU/GPU IP 授權商、INTC 是晶片設計製造商，兩者都屬晶片設計端，
    # 跟下面「半導體設備」（賣機台給晶圓廠的 AMAT/ASML 那類）不同層。
    tickers: [AVGO, MRVL, ALAB, ANET, CRDO, MTSI, NVDA, AMD, "ON", ARM, INTC]

  半導體設備:
    group: growth
    tickers: [AMAT, LRCX, KLAC, ASML, TER, ONTO, ACMR]

  HBM記憶體儲存:
    group: growth
    tickers: [MU, WDC, STX, SIMO]

  AI伺服器硬體:
    group: growth
    # CRWV 與 NBIS 同類：自建機房出租 GPU 算力的 AI 雲端業者。
    tickers: [SMCI, DELL, HPE, VRT, NBIS, CRWV]

  資料中心電力基建:
    group: growth
    # APH（安費諾）做電氣／電子／光纖連接器，屬機房實體互連硬體。
    # 補進來後這個主題脫離 4 檔門檻，不再一掉代號就整個消失。
    tickers: [ETN, HUBB, POWL, VRT, APH]

  發電端:
    group: growth
    # GEV、PWR 的業務同時橫跨發電與輸配電（業務描述明寫「generate, transmit」/
    # 電廠與電網統包工程），拆分時歸在這裡而不是上面的輸配電端。
    # LEU、ALB 跟 核能SMR、鋰電池材料 主題重複——這是刻意的：
    # LEU（鈾濃縮）同時是核能發電鏈的一環，ALB（鋰）同時是電網儲能材料，
    # 兩者在不同主題鏡頭下都站得住腳，不是誤植。
    # FLNC 做電網級儲能系統，屬供電側而非用電側。
    tickers: [GEV, PWR, BE, VST, LEU, ALB, FLNC]

  核能SMR:
    group: growth
    tickers: [SMR, OKLO, NNE, BWXT, LEU]

  鈾核燃料:
    group: growth
    tickers: [CCJ, UEC, DNN, NXE, UUUU, URG]

  太空:
    group: growth
    tickers: [RKLB, ASTS, LUNR, RDW, PL, BKSY, SPCX]

  國防軍事:
    group: growth
    tickers: [LMT, RTX, NOC, GD, LHX, KTOS, AVAV]

  量子運算:
    group: growth
    tickers: [IONQ, RGTI, QBTS, QUBT, INFQ]

  網路安全:
    group: growth
    tickers: [PANW, CRWD, ZS, FTNT, S]

  軟體SaaS:
    group: growth
    tickers: [CRM, NOW, SNOW, DDOG, MDB, TEAM, SNPS, GOOGL, PLTR]

  機器人自動化:
    group: growth
    tickers: [ISRG, ROK, SYM, PATH, TER]

  # ---------- 循環 / 原物料 ----------
  電動車充電:
    group: cyclical
    tickers: [TSLA, RIVN, LCID, CHPT, EVGO]

  鋰電池材料:
    group: cyclical
    tickers: [ALB, SQM, LAC, MP, MVST, QS]

  銅工業金屬:
    group: cyclical
    tickers: [FCX, SCCO, TECK, HBM, ERO]

  油氣服務:
    group: cyclical
    tickers: [SLB, HAL, BKR, WFRD, NOV, FTI]

  # ---------- 避險 ----------
  貴金屬礦:
    group: hedge
    tickers: [NEM, GOLD, AEM, KGC, WPM, PAAS]

  公用事業:
    group: hedge
    tickers: [NEE, DUK, SO, D, AEP, XEL]
